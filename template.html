<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アクセント道場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f1e7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>アクセント道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2622; --sub:#7a6f63; --line:#e4dccd;
  --accent:#c2412d; --accent-ink:#fff; --chip:#efe7d8; --hell:#7a1f12;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1916; --card:#262220; --ink:#f1ebe2; --sub:#a89c8e; --line:#3a342e;
    --accent:#e0644e; --accent-ink:#1c1916; --chip:#332d28; --hell:#f08a74;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1916; --card:#262220; --ink:#f1ebe2; --sub:#a89c8e; --line:#3a342e;
  --accent:#e0644e; --accent-ink:#1c1916; --chip:#332d28; --hell:#f08a74;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Zen Maru Gothic",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
  max-width:640px;margin:0 auto;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-family:"Noto Serif JP",serif;font-size:22px;margin:0;letter-spacing:.08em}
h1 span{color:var(--accent)}
.ver{font-size:11px;color:var(--sub)}
.levels{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;
  background:var(--chip);color:var(--ink)}
.lv[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 22px;
  box-shadow:0 1px 0 var(--line)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;min-height:26px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--sub)}
.badge.hell{background:var(--hell);color:var(--card)}
.emotion{font-size:15px;font-weight:700;color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:18px}
.sent{font-family:"Noto Serif JP",serif;font-size:24px;line-height:2.15;font-weight:500;word-break:break-all}
.sent rt{font-family:"Zen Maru Gothic",sans-serif;font-size:.45em;color:var(--sub);letter-spacing:.02em}
.noruby .sent rt{visibility:hidden}
.reading{margin-top:2px;font-size:16px;color:var(--sub);line-height:1.7;border-top:1px dashed var(--line);padding-top:6px}
.reading[hidden]{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button.big{border:0;border-radius:14px;padding:15px 10px;font:inherit;font-size:16px;font-weight:700}
.play{background:var(--accent);color:var(--accent-ink);grid-column:1 / -1}
.play.speaking{opacity:.75}
.sec{background:var(--chip);color:var(--ink)}
.settings{margin-top:18px;display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--sub)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:18px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:608px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;
  font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.toast span{flex:1}
.toast button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.install-tip{background:var(--chip);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:14px;position:relative}
.install-tip[hidden]{display:none}
.install-tip b{color:var(--accent)}
.install-tip .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;color:var(--sub);padding:4px 8px}
</style>
</head>
<body>
<header>
  <h1>アクセント<span>道場</span></h1>
  <span class="ver">v__VERSION__</span>
</header>

<div class="install-tip" id="installTip" hidden>
  <button class="x" id="installTipClose" aria-label="閉じる">×</button>
  <b>アプリとして使うには</b><br>
  下の共有ボタン（□に↑）→「ホーム画面に追加」をタップ。次からホーム画面のアイコンで起動でき、電波がなくても使えます。
</div>

<nav class="levels" id="levels"></nav>

<main class="card" id="card">
  <div class="meta" id="meta"></div>
  <div class="lines" id="lines"></div>
  <div class="actions">
    <button class="big play" id="play">▶ お手本を聞く</button>
    <button class="big sec" id="showReading">読みを見る</button>
    <button class="big sec" id="next">次の問題 →</button>
  </div>
</main>

<section class="settings">
  <div class="row"><span>ルビ</span>
    <div class="seg" id="rubySeg"><button data-v="on" aria-pressed="true">あり</button><button data-v="off">なし</button></div></div>
  <div class="row"><span>お手本の速さ</span>
    <div class="seg" id="rateSeg"><button data-v="0.75">ゆっくり</button><button data-v="1" aria-pressed="true">ふつう</button></div></div>
</section>

<p class="note">お手本の声が機械っぽいときは、iPhoneの「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 日本語」で「拡張」や「プレミアム」の声をダウンロードすると自然になります。</p>

<div class="toast" id="updateToast" hidden>
  <span>新しいバージョンがあります</span>
  <button id="updateBtn">更新する</button>
</div>

<script>
const DATA = /*__DATA__*/null;
const LEVELS = [
  {key:"初級", label:"初級"},
  {key:"中級", label:"中級"},
  {key:"地獄級", label:"地獄級"},
  {key:"地獄級+感情", label:"地獄級＋感情", src:"地獄級", emotion:true},
];
const EMOTIONS = [
  "泣きながら","ブチギレながら","寝起きで","ささやき声で","恋する乙女で",
  "ラスボス風に","実況アナウンサー風に","幽霊っぽく","高笑いしながら","緊張でガチガチに",
  "全力で言い訳するように","子どもに読み聞かせるように"
];

let level = LEVELS[0], bag = [], current = null, emotion = null, rate = 1;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(){
  const src = level.src || level.key;
  if(!bag.length) bag = shuffle(DATA.items.filter(it=>it.level===src));
  current = bag.pop();
  emotion = level.emotion ? EMOTIONS[Math.floor(Math.random()*EMOTIONS.length)] : null;
  render();
}

function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}

function render(){
  speechSynthesis.cancel(); setSpeaking(false);
  const meta = document.getElementById("meta"); meta.replaceChildren();
  const b = el("span", "badge" + (current.level==="地獄級"?" hell":""), current.level);
  meta.append(b);
  if(emotion) meta.append(el("span","emotion","お題：" + emotion + "読む"));

  const box = document.getElementById("lines"); box.replaceChildren();
  current.lines.forEach(line=>{
    const wrap = el("div");
    const s = el("div","sent");
    line.tokens.forEach(([t,r])=>{
      if(r){const rb=document.createElement("ruby"); rb.append(t); rb.append(el("rt",null,r)); s.append(rb)}
      else s.append(t);
    });
    const rd = el("div","reading",line.reading); rd.hidden = true;
    wrap.append(s, rd); box.append(wrap);
  });
  document.getElementById("showReading").textContent = "読みを見る";
}

/* ---- お手本音声 ---- */
let jaVoice = null;
function chooseVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.replace("_","-").startsWith("ja"));
  const score = v => (/premium|プレミアム/i.test(v.name)?3:0) + (/enhanced|拡張/i.test(v.name)?2:0) + (/kyoko|o-ren|otoya/i.test(v.name)?1:0);
  jaVoice = vs.sort((a,b)=>score(b)-score(a))[0] || null;
}
chooseVoice(); speechSynthesis.onvoiceschanged = chooseVoice;

function setSpeaking(on){
  const p=document.getElementById("play");
  p.classList.toggle("speaking",on); p.textContent = on ? "■ 止める" : "▶ お手本を聞く";
}
function play(){
  if(speechSynthesis.speaking){speechSynthesis.cancel(); setSpeaking(false); return}
  const lines = current.lines;
  lines.forEach((line,i)=>{
    const u = new SpeechSynthesisUtterance(line.text);
    u.lang="ja-JP"; if(jaVoice) u.voice=jaVoice; u.rate=rate;
    if(i===lines.length-1){u.onend=()=>setSpeaking(false); u.onerror=()=>setSpeaking(false)}
    speechSynthesis.speak(u);
  });
  setSpeaking(true);
}

/* ---- UI ---- */
const nav = document.getElementById("levels");
LEVELS.forEach((lv,i)=>{
  const b = el("button","lv",lv.label); b.setAttribute("aria-pressed", i===0?"true":"false");
  b.onclick=()=>{ level=lv; bag=[]; nav.querySelectorAll(".lv").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); pick(); };
  nav.append(b);
});
document.getElementById("play").onclick = play;
document.getElementById("next").onclick = pick;
document.getElementById("showReading").onclick = e=>{
  const rds=[...document.querySelectorAll(".reading")]; const show = rds[0].hidden;
  rds.forEach(r=>r.hidden=!show); e.target.textContent = show ? "読みを隠す" : "読みを見る";
};
function seg(id, fn){
  const s=document.getElementById(id);
  s.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true"); fn(b.dataset.v);
  });
}
seg("rubySeg", v=>document.body.classList.toggle("noruby", v==="off"));
seg("rateSeg", v=>rate=parseFloat(v));

pick();

/* ---- ホーム画面に追加の案内（iPhoneのSafariで、まだ追加していない時だけ） ---- */
(function(){
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let dismissed = false;
  try { dismissed = localStorage.getItem("installTipDismissed") === "1"; } catch {}
  const tip = document.getElementById("installTip");
  if (ios && !standalone && !dismissed) tip.hidden = false;
  document.getElementById("installTipClose").onclick = () => {
    tip.hidden = true;
    try { localStorage.setItem("installTipDismissed", "1"); } catch {}
  };
})();

/* ---- オフライン対応と更新のお知らせ ---- */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").then(reg => {
    const toast = document.getElementById("updateToast");
    const offer = w => { toast.hidden = false; document.getElementById("updateBtn").onclick = () => w.postMessage("skipWaiting"); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) offer(w);
      });
    });
    // アプリを開き直すたびに新しい版がないか確認
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update(); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!reloaded) { reloaded = true; location.reload(); }
  });
}
</script>
</body>
</html>
